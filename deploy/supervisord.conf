[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:task1]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8001
directory=/app/task1-knowledge-brain
autostart=true
autorestart=true
stderr_logfile=/var/log/task1.err.log
stdout_logfile=/var/log/task1.out.log

[program:task2]
command=npm run start:prod
directory=/app/task2-inbox-agent
autostart=true
autorestart=true
environment=TASK1_API_URL="http://127.0.0.1:8001"
stderr_logfile=/var/log/task2.err.log
stdout_logfile=/var/log/task2.out.log

[program:task3]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8003
directory=/app/task3-meeting-to-scope
autostart=true
autorestart=true
environment=TASK1_API_URL="http://127.0.0.1:8001"
stderr_logfile=/var/log/task3.err.log
stdout_logfile=/var/log/task3.out.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log
